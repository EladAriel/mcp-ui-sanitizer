[project]
name = "ui-design-sanitizer"
version = "0.1.0"
description = "Fail-closed UI artifact sanitization service with FastAPI and MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "langchain>=1.3.12",
    "langchain-anthropic>=1.4.8",
    "langchain-openai>=1.3.4",
    "langfuse>=4.13.2",
    "mcp>=1.27,<2",
    "pydantic-settings>=2.14.2",
    "sse-starlette>=3.4.5",
    "tree-sitter>=0.26.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[project.scripts]
ui-sanitizer-api = "app.main:run"
ui-sanitizer-mcp = "app.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
